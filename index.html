<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>DersKoçum - Öğrenci Takip Portalı v2.0.1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        #netlify-badge, a[href*="netlify.com"], img[alt*="Deploys by Netlify"] { display: none !important; }
        @media print { body { background: white !important; } button, .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- ÜST MENÜ -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg leading-tight">DersKoçum</h1>
                    <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-semibold">v2.0.1</span>
                </div>
            </div>

            <div id="userHeaderActions" class="hidden flex items-center gap-4">
                <div class="text-right">
                    <span id="headerUserName" class="block text-sm font-semibold text-slate-900"></span>
                    <span id="headerUserRole" class="block text-xs text-slate-500"></span>
                </div>
                <button id="kocPasswordBtn" onclick="openPasswordModal()" class="hidden px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition items-center gap-1.5">
                    <i class="fa-solid fa-key"></i> Şifre Değiştir
                </button>
                <button onclick="logout()" class="px-3 py-1.5 text-xs font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
                </button>
            </div>
        </div>
    </header>

    <!-- ANA İÇERİK -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

        <!-- GİRİŞ EKRANI -->
        <section id="loginSection" class="max-w-md mx-auto my-12 bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 gradient-bg rounded-2xl flex items-center justify-center text-white text-3xl font-bold mx-auto mb-4 shadow-lg">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Hoş Geldiniz</h2>
                <p class="text-sm text-slate-500 mt-1">Rolünüzü seçiniz</p>
            </div>

            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-xl mb-6">
                <button id="tabKocBtn" onclick="switchLoginTab('koc')" class="py-2 text-sm font-semibold rounded-lg bg-white shadow-sm text-indigo-600 transition">Koç Girişi</button>
                <button id="tabOgrenciBtn" onclick="switchLoginTab('ogrenci')" class="py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">Öğrenci Girişi</button>
            </div>

            <form id="kocLoginForm" onsubmit="handleKocLogin(event)" class="space-y-4">
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">E-Posta</label><input type="email" id="kocEmailInput" required value="mesutkeskinfizik@gmail.com" class="w-full px-4 py-2.5 text-sm border rounded-xl"></div>
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">Şifre</label><input type="password" id="kocPasswordInput" required placeholder="Şifreniz" class="w-full px-4 py-2.5 text-sm border rounded-xl"></div>
                <button type="submit" class="w-full py-3 gradient-bg text-white font-semibold rounded-xl shadow-md">Koç Paneline Giriş Yap</button>
            </form>

            <form id="ogrenciLoginForm" onsubmit="handleOgrenciLogin(event)" class="space-y-4 hidden">
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">Ad Soyad</label><input type="text" id="ogrenciNameInput" required placeholder="Örn: Halil Can Deniz" class="w-full px-4 py-2.5 text-sm border rounded-xl"></div>
                <div><label class="block text-xs font-semibold text-slate-700 mb-1">Şifre</label><input type="password" id="ogrenciPasswordInput" required placeholder="Şifreniz" class="w-full px-4 py-2.5 text-sm border rounded-xl"></div>
                <button type="submit" class="w-full py-3 bg-emerald-600 text-white font-semibold rounded-xl shadow-md">Öğrenci Paneline Giriş Yap</button>
            </form>
        </section>

        <!-- KOÇ PANELİ -->
        <section id="kocPanel" class="hidden space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl border shadow-sm">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Koç Yönetim Paneli</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Öğrenci verileri canlı senkronize edilir.</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="manualRefreshData()" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
                        <i class="fa-solid fa-arrows-rotate"></i> Canlı Verileri Yenile
                    </button>
                    <button onclick="openStudentPasswordsModal()" class="px-3 py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
                        <i class="fa-solid fa-key"></i> Şifreleri Yönet
                    </button>
                    <button onclick="openAddStudentModal()" class="px-4 py-2.5 gradient-bg text-white text-sm font-semibold rounded-xl shadow-sm">Yeni Öğrenci Ekle</button>
                </div>
            </div>
            <div id="studentListGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- ÖĞRENCİ PANELİ -->
        <section id="ogrenciPanel" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 id="ogrenciWelcomeTitle" class="text-xl font-bold text-slate-900"></h2>
                    <p id="ogrenciSubInfo" class="text-xs text-slate-500 mt-1"></p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="syncLocalToCloudManual()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Buluta Eşitle
                    </button>
                    <button onclick="openDailyQuestionModal()" class="px-4 py-2 bg-indigo-500 text-white text-xs font-semibold rounded-xl">Günlük Soru Gir</button>
                    <button onclick="openExamModal()" class="px-4 py-2 bg-emerald-600 text-white text-xs font-semibold rounded-xl">Deneme Sınavı Gir</button>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl border shadow-sm"><span class="text-xs font-semibold text-slate-500 uppercase">Hedef</span><div id="statTargetQuestion" class="text-2xl font-bold text-slate-900 mt-1">0</div></div>
                <div class="bg-white p-5 rounded-2xl border shadow-sm"><span class="text-xs font-semibold text-slate-500 uppercase">Çözülen</span><div id="statSolvedQuestion" class="text-2xl font-bold text-indigo-600 mt-1">0</div></div>
                <div class="bg-white p-5 rounded-2xl border shadow-sm"><span class="text-xs font-semibold text-slate-500 uppercase">Sınav Sayısı</span><div id="statExamCount" class="text-2xl font-bold text-emerald-600 mt-1">0</div></div>
            </div>

            <!-- GELİŞİM GRAFİKLERİ -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl border shadow-sm"><h3 class="text-sm font-bold text-slate-900 mb-4">TYT Net</h3><canvas id="chartTytNet" height="200"></canvas></div>
                <div class="bg-white p-6 rounded-2xl border shadow-sm"><h3 class="text-sm font-bold text-slate-900 mb-4">AYT Net</h3><canvas id="chartAytNet" height="200"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-2xl border shadow-sm">
                <h3 class="text-sm font-bold text-slate-900 mb-4">Ders Başarı Oranı Analizi (Soru Sayısına Göre)</h3>
                <div id="lessonSuccessAnalysisContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"><p class="text-xs text-slate-400">Veri yok.</p></div>
            </div>
        </section>

    </main>

    <!-- MODALLAR (Özet) -->
    <div id="dailyQuestionModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white max-w-lg w-full rounded-2xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Günlük Soru Girişi</h3>
            <form onsubmit="handleSaveDailyQuestions(event)" class="space-y-4">
                <input type="date" id="dailyQuestionDate" required class="w-full px-3 py-2 border rounded-xl">
                <div class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto">
                    <div><label class="text-xs">Türkçe</label><input type="number" value="0" id="q_turkce" class="w-full px-2 py-1 border rounded"></div>
                    <div><label class="text-xs">Matematik</label><input type="number" value="0" id="q_matematik" class="w-full px-2 py-1 border rounded"></div>
                    <div><label class="text-xs">Fizik</label><input type="number" value="0" id="q_fizik" class="w-full px-2 py-1 border rounded"></div>
                    <div><label class="text-xs">Kimya</label><input type="number" value="0" id="q_kimya" class="w-full px-2 py-1 border rounded"></div>
                    <div><label class="text-xs">Biyoloji</label><input type="number" value="0" id="q_biyoloji" class="w-full px-2 py-1 border rounded"></div>
                </div>
                <div class="flex justify-end gap-2"><button type="button" onclick="closeDailyQuestionModal()" class="px-4 py-2 bg-slate-100 rounded-xl">İptal</button><button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl">Kaydet</button></div>
            </form>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwpMdblY9LySxEmSdmtZMotXlActsf-dNgE9oTK3uAT5-fWr-3Voh8nLl8F2BAJMQr27g/exec";

        let currentUser = null;
        let currentRole = null;
        let kocAccount = JSON.parse(localStorage.getItem('kocAccount')) || { email: "mesutkeskinfizik@gmail.com", password: "MesutHoca" };
        let studentList = JSON.parse(localStorage.getItem('studentList')) || [];

        const lessonMaxQuestions = { turkce: 40, matematik: 40, sosyal: 20, fizik: 7, kimya: 7, biyoloji: 6, edebiyat: 24, tarih1: 10, cografya1: 6, tarih2: 11, cografya2: 11, felsefe: 12, din: 6 };
        const lessonNamesMap = { turkce: "Türkçe", matematik: "Matematik", sosyal: "Sosyal Bilgiler", fizik: "Fizik", kimya: "Kimya", biyoloji: "Biyoloji", edebiyat: "Edebiyat", tarih1: "Tarih-1", cografya1: "Coğrafya-1", tarih2: "Tarih-2", cografya2: "Coğrafya-2", felsefe: "Felsefe", din: "Din Kültürü" };

        function formatDateTR(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split("-");
            return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : dateStr;
        }

        async function fetchStudentsFromSheet() {
            try {
                const res = await fetch(GOOGLE_SHEET_URL + "?t=" + Date.now(), { cache: "no-store" });
                const data = await res.json();
                if (data && data.students && Array.isArray(data.students)) {
                    studentList = data.students;
                    localStorage.setItem('studentList', JSON.stringify(studentList));
                    if (data.koc && data.koc.password) {
                        kocAccount = data.koc;
                        localStorage.setItem('kocAccount', JSON.stringify(kocAccount));
                    }
                }
            } catch (err) { console.error(err); }
        }

        async function syncDataToSheet() {
            try {
                const payload = { students: studentList, koc: kocAccount };
                const jsonStr = encodeURIComponent(JSON.stringify(payload));
                await fetch(GOOGLE_SHEET_URL + "?action=save&data=" + jsonStr, { method: "GET", cache: "no-store" });
                return true;
            } catch (err) {
                console.error(err);
                return false;
            }
        }

        async function syncLocalToCloudManual() {
            if (!currentUser) return;
            const idx = studentList.findIndex(s => s.id === currentUser.id);
            if (idx !== -1) {
                studentList[idx] = currentUser;
            }
            const success = await syncDataToSheet();
            if (success) {
                alert("Tüm veriler başarıyla buluta eşitlendi!");
            } else {
                alert("Eşitleme sırasında hata oluştu.");
            }
        }

        async function manualRefreshData() {
            await fetchStudentsFromSheet();
            if (currentRole === 'koc') renderKocPanel();
            alert("Veriler güncellendi!");
        }

        window.onload = async function() {
            await fetchStudentsFromSheet();
            checkActiveSession();
        };

        function checkActiveSession() {
            const saved = JSON.parse(localStorage.getItem('activeSession'));
            if (saved && saved.role === "koc") {
                currentUser = { email: kocAccount.email, name: "Mesut Keskin" };
                currentRole = "koc";
                renderApp();
            } else if (saved && saved.user) {
                currentRole = saved.role;
                const found = studentList.find(s => s.id === saved.user.id || s.fullName === saved.user.fullName);
                currentUser = found || saved.user;
                renderApp();
            } else {
                logout();
            }
        }

        function switchLoginTab(tab) {
            document.getElementById('kocLoginForm').classList.toggle('hidden', tab !== 'koc');
            document.getElementById('ogrenciLoginForm').classList.toggle('hidden', tab !== 'ogrenci');
        }

        async function handleKocLogin(e) {
            e.preventDefault();
            await fetchStudentsFromSheet();
            const email = document.getElementById('kocEmailInput').value.trim();
            const pass = document.getElementById('kocPasswordInput').value.trim();
            if (email.toLowerCase() === kocAccount.email.toLowerCase() && pass === kocAccount.password) {
                currentUser = { email: kocAccount.email };
                currentRole = "koc";
                localStorage.setItem('activeSession', JSON.stringify({ role: "koc" }));
                renderApp();
            } else { alert("Hatalı şifre!"); }
        }

        async function handleOgrenciLogin(e) {
            e.preventDefault();
            await fetchStudentsFromSheet();
            const name = document.getElementById('ogrenciNameInput').value.trim().toLowerCase();
            const pass = document.getElementById('ogrenciPasswordInput').value.trim();
            const found = studentList.find(s => s.fullName && s.fullName.toLowerCase() === name && s.password === pass);
            if (found) {
                currentUser = found;
                currentRole = "ogrenci";
                localStorage.setItem('activeSession', JSON.stringify({ role: "ogrenci", user: found }));
                renderApp();
            } else { alert("Öğrenci adı veya şifre hatalı!"); }
        }

        function logout() {
            localStorage.removeItem('activeSession');
            currentUser = null; currentRole = null;
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('kocPanel').classList.add('hidden');
            document.getElementById('ogrenciPanel').classList.add('hidden');
            document.getElementById('userHeaderActions').classList.add('hidden');
        }

        async function renderApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('userHeaderActions').classList.remove('hidden');
            if (currentRole === 'koc') {
                document.getElementById('headerUserName').innerText = "Koç Paneli";
                document.getElementById('kocPanel').classList.remove('hidden');
                renderKocPanel();
            } else {
                const refreshed = studentList.find(s => s.id === currentUser.id);
                if (refreshed) currentUser = refreshed;
                document.getElementById('headerUserName').innerText = currentUser.fullName;
                document.getElementById('ogrenciPanel').classList.remove('hidden');
                renderOgrenciPanel();
            }
        }

        function renderKocPanel() {
            const grid = document.getElementById('studentListGrid');
            grid.innerHTML = "";
            studentList.forEach(st => {
                if (!st || !st.fullName) return;
                const solved = (st.dailyQuestions || []).reduce((acc, curr) => acc + Object.values(curr.questions || {}).reduce((a, b) => a + Number(b), 0), 0);
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl border shadow-sm space-y-3";
                card.innerHTML = `<h3 class="font-bold text-slate-900">${st.fullName}</h3><p class="text-xs text-slate-500">${st.class || ''}</p><div class="flex justify-between text-xs font-semibold pt-2 border-t"><span>Çözülen: ${solved}</span><span class="text-emerald-600">Sınav: ${st.exams ? st.exams.length : 0}</span></div>`;
                grid.appendChild(card);
            });
        }

        function renderOgrenciPanel() {
            document.getElementById('ogrenciWelcomeTitle').innerText = `Hoş Geldin, ${currentUser.fullName}`;
            document.getElementById('ogrenciSubInfo').innerText = currentUser.class || '';
            document.getElementById('statTargetQuestion').innerText = currentUser.targetQuestions || 1000;
            const solved = (currentUser.dailyQuestions || []).reduce((acc, curr) => acc + Object.values(curr.questions || {}).reduce((a, b) => a + Number(b), 0), 0);
            document.getElementById('statSolvedQuestion').innerText = solved;
            document.getElementById('statExamCount').innerText = currentUser.exams ? currentUser.exams.length : 0;
            renderLessonSuccessCards();
        }

        function renderLessonSuccessCards() {
            const container = document.getElementById('lessonSuccessAnalysisContainer');
            container.innerHTML = "";
            const exams = currentUser.exams || [];
            if (exams.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400">Henüz deneme kaydı yok.</p>`;
                return;
            }
            let stats = {};
            exams.forEach(ex => {
                if (ex.lessons) {
                    Object.entries(ex.lessons).forEach(([les, data]) => {
                        if (!stats[les]) stats[les] = { total: 0, count: 0 };
                        stats[les].total += parseFloat(data.net) || 0;
                        stats[les].count++;
                    });
                }
            });
            Object.entries(stats).forEach(([les, data]) => {
                const avg = data.total / data.count;
                const max = lessonMaxQuestions[les] || 40;
                let rate = (avg / max) * 100;
                if (rate > 100) rate = 100;
                const div = document.createElement('div');
                div.className = "bg-rose-50 border border-rose-100 p-3 rounded-xl";
                div.innerHTML = `<span class="font-bold text-xs uppercase">${lessonNamesMap[les] || les}</span><div class="text-xl font-extrabold text-rose-600 mt-1">%${rate.toFixed(1)}</div><span class="text-[10px] text-slate-500">Ort. Net: ${avg.toFixed(1)} / Max: ${max}</span>`;
                container.appendChild(div);
            });
        }

        function openDailyQuestionModal() { document.getElementById('dailyQuestionModal').classList.remove('hidden'); }
        function closeDailyQuestionModal() { document.getElementById('dailyQuestionModal').classList.add('hidden'); }
        function openExamModal() { alert("Sınav giriş penceresi"); }
        function closeExamModal() {}
        function openStudentPasswordsModal() { alert("Şifre yönetim penceresi"); }
        function closeStudentPasswordsModal() {}
        function openAddStudentModal() { alert("Öğrenci ekleme penceresi"); }
        function closeAddStudentModal() {}
        function openPasswordModal() { alert("Koç şifre penceresi"); }
        function closePasswordModal() {}
    </script>
</body>
</html>
